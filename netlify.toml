[build]
  command = "npm run build"
  publish = "dist"

[dev]
  port = 5173
  targetPort = 5173
  autoLaunch = false

[functions]
  directory = "netlify/functions"

[[netlify]]
  enable_blobs = true

# SPA fallback: let the client-side router handle deep links (/skills, /projects, …).
# Real files (llms.txt, assets) and the function routes take precedence.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
